<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>MONGO AI</title>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#111114;--panel2:#18181d;--red:#d7193f;--red2:#8f102b;--text:#f4f4f5;--muted:#a1a1aa;--line:#2b2025}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#42101d 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
    .app{max-width:980px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:18px}
    header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 2px 16px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.12em}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,var(--red),#4c0718);display:grid;place-items:center;box-shadow:0 0 24px #d7193f44;font-size:21px}
    .tag{font-size:11px;color:#ff9caf;border:1px solid #6e1c30;padding:4px 8px;border-radius:99px;letter-spacing:.1em}
    .chat{flex:1;display:flex;flex-direction:column;gap:16px;padding:24px 0;min-height:400px}
    .welcome{text-align:center;margin:auto auto 12px;max-width:570px}.welcome h1{font-size:clamp(30px,6vw,48px);line-height:1.05;margin:0 0 12px;letter-spacing:-.04em}.welcome h1 span{color:#ff365d}.welcome p{color:var(--muted);margin:0}
    .messages{display:flex;flex-direction:column;gap:14px}.msg{max-width:82%;padding:13px 16px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:linear-gradient(135deg,#94132e,#5e0b20);border-bottom-right-radius:5px}.assistant{align-self:flex-start;background:var(--panel2);border:1px solid #30252a;border-bottom-left-radius:5px}.who{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#ff9caf;margin-bottom:5px;font-weight:800}
    .composer-wrap{position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(transparent,var(--bg) 20%)}.composer{display:flex;gap:10px;background:var(--panel);border:1px solid #49303a;border-radius:18px;padding:10px;box-shadow:0 12px 35px #0008}.composer textarea{resize:none;flex:1;min-height:46px;max-height:150px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:11px}.send{border:0;border-radius:13px;background:var(--red);color:white;font-weight:800;padding:0 20px;cursor:pointer}.send:disabled{opacity:.5;cursor:wait}.tools{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;padding:8px 4px}.settings{background:none;border:1px solid #49303a;color:#fda5b4;border-radius:10px;padding:7px 11px;cursor:pointer}
    .modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:18px}.modal.open{display:grid}.dialog{width:min(100%,480px);background:#141116;border:1px solid #653044;border-radius:18px;padding:22px;box-shadow:0 20px 80px #000}.dialog h2{margin:0 0 6px}.dialog p{color:var(--muted);font-size:13px}.dialog label{display:block;font-size:13px;margin:14px 0 6px}.dialog input{width:100%;padding:12px;border:1px solid #49303a;border-radius:10px;background:#09090b;color:white}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.actions button{padding:10px 14px;border-radius:10px;border:1px solid #49303a;background:#21171c;color:white;cursor:pointer}.actions .primary{background:var(--red);border-color:var(--red)}.status{min-height:18px;color:#fda4af;font-size:12px;margin-top:8px}
    @media(max-width:560px){.app{padding:12px}.msg{max-width:94%}.composer{gap:5px}.send{padding:0 14px}.tag{display:none}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><div class="logo">M</div><span>MONGO AI</span></div>
      <span class="tag">BETA • BLOOD RED EDITION</span>
    </header>
    <section class="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <h1>WHAT'S UP, <span>CHAOS?</span></h1>
        <p>I'm Mongo AI. Ask me something, brainstorm an idea, or get help building something.</p>
      </div>
      <div class="messages" id="messages"></div>
    </section>
    <section class="composer-wrap">
      <form class="composer" id="chatForm">
        <textarea id="prompt" placeholder="Message Mongo AI..." rows="1" aria-label="Message Mongo AI"></textarea>
        <button class="send" id="send" type="submit">SEND</button>
      </form>
      <div class="tools"><span id="status">Ready when you are.</span><button class="settings" id="settingsBtn" type="button">⚙ Settings</button></div>
    </section>
  </main>

  <div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="dialog">
      <h2 id="settingsTitle">Mongo AI settings</h2>
      <p>Your API key belongs on the server, not in this page. Set it in the project's <code>.env</code> file.</p>
      <label for="apiStatus">Connection</label>
      <input id="apiStatus" value="Managed securely by the server" readonly>
      <div class="actions"><button id="closeSettings" type="button">Close</button></div>
    </div>
  </div>
  <script>
    const form = document.getElementById('chatForm');
    const promptBox = document.getElementById('prompt');
    const messages = document.getElementById('messages');
    const send = document.getElementById('send');
    const statusEl = document.getElementById('status');
    const welcome = document.getElementById('welcome');

    function addMessage(role, text) {
      welcome.style.display = 'none';
      const item = document.createElement('div');
      item.className = `msg ${role}`;
      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = role === 'user' ? 'You' : 'Mongo AI';
      const body = document.createElement('div');
      body.textContent = text;
      item.append(who, body);
      messages.appendChild(item);
      item.scrollIntoView({behavior:'smooth', block:'end'});
      return body;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = promptBox.value.trim();
      if (!message || send.disabled) return;
      addMessage('user', message);
      promptBox.value = '';
      promptBox.style.height = 'auto';
      send.disabled = true;
      statusEl.textContent = 'Mongo AI is thinking...';
      const reply = addMessage('assistant', '...');
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({message})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'The server could not answer.');
        reply.textContent = data.reply;
        statusEl.textContent = 'Connected.';
      } catch (error) {
        reply.textContent = `Connection error: ${error.message}`;
        statusEl.textContent = 'Check the server setup.';
      } finally {
        send.disabled = false;
        promptBox.focus();
      }
    });
    promptBox.addEventListener('input', () => {
      promptBox.style.height = 'auto';
      promptBox.style.height = Math.min(promptBox.scrollHeight, 150) + 'px';
    });
    promptBox.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
    const modal = document.getElementById('settingsModal');
    document.getElementById('settingsBtn').onclick = () => modal.classList.add('open');
    document.getElementById('closeSettings').onclick = () => modal.classList.remove('open');
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
  </script>
</body>
</html>
